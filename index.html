<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <meta name="description" content="Дневник тренировок с периодизацией и планом на каждый день">
  <title>GymCoach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>GymCoach</h1>
    <span id="phasePill" class="pill"></span>
  </header>

  <main id="view"></main>

  <div class="timer" id="timer">
    <div class="bar"><i id="timerBar"></i></div>
    <div class="row between">
      <div>
        <div class="small muted">Отдых</div>
        <div class="time" id="timerTime">0:00</div>
      </div>
      <div class="row">
        <button class="small" data-timer="-15">−15</button>
        <button class="small" data-timer="15">+15</button>
        <button class="small" data-timer="stop">Стоп</button>
      </div>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Сегодня</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>История</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-6 4 4 8-8"/><path d="M15 8h6v6"/></svg>Прогресс</button>
    <button data-tab="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Анализ</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Настройки</button>
  </nav>

  <input type="file" id="fileTxt" accept=".txt,text/plain" class="hidden">
  <input type="file" id="fileJson" accept=".json,application/json" class="hidden">

  <script type="module" src="js/app.js"></script>
</body>
</html>
